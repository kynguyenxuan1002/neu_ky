version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: smarthome-postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: smarthomedb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smarthomedb"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
